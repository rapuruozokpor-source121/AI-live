
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI LIVE - Luna</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10101d;
  color: white;
}
header {
  padding: 18px;
  background: #1c1c31;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}
header span { color: #ff4f99; }
main {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 20px;
}
.panel {
  background: #202038;
  border-radius: 16px;
  padding: 15px;
}
video {
  width: 100%;
  max-height: 600px;
  border-radius: 12px;
  background: black;
  object-fit: contain;
}
.status { color: #a4ffb3; font-size: 14px; }
.gifts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}
button {
  background: #ff4f99;
  border: 0;
  color: white;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
}
button:hover { background: #db307b; }
button:disabled { opacity: .5; cursor: wait; }
#messages {
  height: 410px;
  overflow-y: auto;
  background: #151526;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 12px;
}
.message {
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
.user { background: #35355c; }
.ai { background: #572b4d; }
.chat-input { display: flex; gap: 8px; }
input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 8px;
  border: none;
}
#giftEffect {
  text-align: center;
  font-size: 28px;
  min-height: 40px;
}
@media (max-width: 750px) {
  main { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>✨ <span>AI LIVE</span> with Luna</header>

<main>
  <section class="panel">
    <h2>🔴 Luna Live</h2>
    <p class="status">● AI Host Online</p>

    <video id="avatarVideo" autoplay muted loop playsinline>
      <source src="avatar.mp4" type="video/mp4">
    </video>

    <div id="giftEffect"></div>

    <h3>Send a virtual gift</h3>
    <div class="gifts">
      <button onclick="sendGift('Heart')">❤️ Heart</button>
      <button onclick="sendGift('Rose')">🌹 Rose</button>
      <button onclick="sendGift('Star')">⭐ Star</button>
    </div>
    <p style="font-size:12px;color:#bbb">
      Demo gifts only. No real payments.
    </p>
  </section>

  <section class="panel">
    <h2>💬 Live Chat</h2>
    <div id="messages"></div>

    <form class="chat-input" id="chatForm">
      <input
        id="chatInput"
        maxlength="1000"
        placeholder="Say something to Luna..."
        required
      >
      <button id="sendButton" type="submit">Send</button>
    </form>
  </section>
</main>

<script>
const API_URL =
  "https://l.rapuruozokpor-404.workers.dev";

const video = document.getElementById("avatarVideo");
const messages = document.getElementById("messages");
const chatInput = document.getElementById("chatInput");
const sendButton = document.getElementById("sendButton");
const giftEffect = document.getElementById("giftEffect");

let giftTimer;

function addMessage(sender, text) {
  const div = document.createElement("div");
  div.className = "message " + (sender === "You" ? "user" : "ai");
  div.textContent = sender + ": " + text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

addMessage("Luna", "Hello! Welcome to AI LIVE! 💕");

document.getElementById("chatForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = chatInput.value.trim();
    if (!message) return;

    addMessage("You", message);
    chatInput.value = "";
    sendButton.disabled = true;
    sendButton.textContent = "...";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }

      addMessage("Luna", data.reply);

    } catch (error) {
      addMessage("Luna", "Connection problem: " + error.message);
    } finally {
      sendButton.disabled = false;
      sendButton.textContent = "Send";
      chatInput.focus();
    }
  });

function sendGift(gift) {
  const emojis = {
    Heart: "❤️❤️❤️",
    Rose: "🌹🌹🌹",
    Star: "⭐⭐⭐"
  };

  const reactions = {
    Heart: "Thank you for the love! ❤️",
    Rose: "A beautiful rose! Thank you! 🌹",
    Star: "You're a superstar! ⭐"
  };

  giftEffect.textContent = emojis[gift];
  addMessage("Luna", reactions[gift]);

  clearTimeout(giftTimer);

  video.pause();
  video.src = "dance.mp4";
  video.loop = false;
  video.load();
  video.play().catch(() => {});

  giftTimer = setTimeout(() => {
    giftEffect.textContent = "";
    restoreAvatar();
  }, 6000);
}

function restoreAvatar() {
  clearTimeout(giftTimer);
  video.pause();
  video.src = "avatar.mp4";
  video.loop = true;
  video.load();
  video.play().catch(() => {});
}

video.addEventListener("ended", restoreAvatar);
</script>

</body>
</html>
